AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Lambda autenticadora da Oficina360

Parameters:
  DatabaseHost:
    Type: String
    Description: Endpoint do Amazon RDS PostgreSQL

  DatabasePort:
    Type: String
    Default: "5432"

  DatabaseName:
    Type: String
    Default: oficina360

  DatabaseUsername:
    Type: String
    NoEcho: true

  DatabasePassword:
    Type: String
    NoEcho: true

  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32

  JwtIssuer:
    Type: String
    Default: oficina360-auth

  JwtExpiration:
    Type: String
    Default: "3600"

  DatabaseAccessSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets utilizadas pela Lambda

Globals:
  Function:
    Runtime: java21
    Timeout: 15
    MemorySize: 512

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: oficina360-auth

      Handler: com.techchallenger.oficina360.Handler::handleRequest

      CodeUri: .

      VpcConfig:
        SecurityGroupIds:
          - !Ref DatabaseAccessSecurityGroupId
        SubnetIds: !Ref LambdaSubnetIds

      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole

      Environment:
        Variables:
          DB_URL: !Sub
            - jdbc:postgresql://${Host}:${Port}/${Database}
            - Host: !Ref DatabaseHost
              Port: !Ref DatabasePort
              Database: !Ref DatabaseName

          DB_USERNAME: !Ref DatabaseUsername
          DB_PASSWORD: !Ref DatabasePassword

          JWT_SECRET: !Ref JwtSecret
          JWT_ISSUER: !Ref JwtIssuer
          JWT_EXPIRATION: !Ref JwtExpiration

      Events:
        Auth:
          Type: Api
          Properties:
            Path: /auth
            Method: POST

Outputs:
  AuthFunctionName:
    Description: Nome da função autenticadora
    Value: !Ref AuthFunction

  AuthApiUrl:
    Description: URL do endpoint de autenticação
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/auth

  AuthFunctionArn:
    Description: ARN da função autenticadora
    Value: !GetAtt AuthFunction.Arn