---
name: CI/CD Lambda

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

env:
  JAVA_VERSION: "21"
  AWS_REGION: "us-east-1"
  SAM_CLI_TELEMETRY: 0

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECURITY: OWASP
  # ============================================================

  security:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # --------------------------------------------------------
      # OWASP cache
      # --------------------------------------------------------

      - name: Get OWASP cache date
        id: cache-date
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP cache
        id: owasp-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-owasp-

      - name: OWASP Dependency Check
        run: mvn --no-transfer-progress dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # --------------------------------------------------------
      # Save OWASP cache
      # --------------------------------------------------------

      - name: Save OWASP cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ steps.cache-date.outputs.date }}


  # ============================================================
  # 2. BUILD + TEST + COVERAGE
  # ============================================================

  test:
    name: Build, Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        run: mvn --no-transfer-progress clean verify

      # --------------------------------------------------------
      # Build artifact
      # --------------------------------------------------------

      - name: Verify JAR
        run: |
          echo "Generated JAR:"
          ls -lh target/*.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lambda-build
          path: |
            target/*.jar
            docs/security/jacoco/jacoco.xml


  # ============================================================
  # 3. SONARCLOUD
  # ============================================================

  sonar:
    name: SonarCloud
    needs:
      - security
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lambda-build
          path: .

      - name: Verify JaCoCo report
        run: |
          echo "JaCoCo report:"
          find . -name "jacoco.xml" -print

          echo ""
          echo "JAR:"
          ls -lh target/*.jar

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn --no-transfer-progress sonar:sonar \
            -Dsonar.projectKey=michaelhion_oficina360_lambda \
            -Dsonar.organization=michaelhion \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=docs/security/jacoco/jacoco.xml


  # ============================================================
  # 4. SAM BUILD
  # ============================================================

  sam-build:
    name: SAM Build
    needs: sonar

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      - name: Upload SAM build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-build
          path: .aws-sam


  # ============================================================
  # 5. DEPLOY HOMOLOGATION
  # ============================================================

  deploy-homolog:
    name: Deploy Homologation
    needs: sam-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    environment:
      name: homologation

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Download SAM build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-build
          path: .aws-sam

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          sam deploy \
            --stack-name oficina360-auth-homolog \
            --region "${{ env.AWS_REGION }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment=homolog


  # ============================================================
  # 6. DEPLOY PRODUCTION
  # ============================================================

  deploy-production:
    name: Deploy Production
    needs: sam-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Download SAM build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-build
          path: .aws-sam

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          sam deploy \
            --stack-name oficina360-auth-prod \
            --region "${{ env.AWS_REGION }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment=prod