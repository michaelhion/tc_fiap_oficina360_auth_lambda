name: SAM Lambda Deploy

run-name: SAM Lambda - ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Lambda action
        required: true
        type: choice
        options:
          - validate
          - deploy
          - destroy

permissions:
  contents: read

concurrency:
  group: oficina360-lambda
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: oficina360-auth
  SAM_CLI_TELEMETRY: "0"

jobs:
  lambda:
    name: Lambda ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: inputs.action != 'destroy'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configurar credenciais AWS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar identidade AWS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          : "${ACCOUNT_ID:?Conta AWS nao identificada}"

          SAM_ARTIFACTS_BUCKET="oficina360-sam-${ACCOUNT_ID}-${AWS_REGION}"
          SAM_ARTIFACTS_PREFIX="sam/${STACK_NAME}"

          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "SAM_ARTIFACTS_BUCKET=$SAM_ARTIFACTS_BUCKET" >> "$GITHUB_ENV"
          echo "SAM_ARTIFACTS_PREFIX=$SAM_ARTIFACTS_PREFIX" >> "$GITHUB_ENV"

          echo "Conta AWS: $ACCOUNT_ID"
          echo "Bucket SAM: $SAM_ARTIFACTS_BUCKET"
          echo "Prefixo SAM: $SAM_ARTIFACTS_PREFIX"

      - name: Validar template SAM
        if: inputs.action != 'destroy'
        run: sam validate --lint

      - name: Build Lambda
        if: inputs.action != 'destroy'
        run: sam build

      - name: Preparar bucket de artefatos SAM
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail

          : "${SAM_ARTIFACTS_BUCKET:?Bucket SAM nao calculado}"
          : "${SAM_ARTIFACTS_PREFIX:?Prefixo SAM nao calculado}"

          if aws s3api head-bucket \
            --bucket "$SAM_ARTIFACTS_BUCKET" \
            >/dev/null 2>&1; then

            echo "Bucket SAM existente: $SAM_ARTIFACTS_BUCKET"
          else
            echo "Bucket SAM ausente ou inacessivel. Tentando criar..."

            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "$SAM_ARTIFACTS_BUCKET" \
                --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$SAM_ARTIFACTS_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration \
                  "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3api put-public-access-block \
            --bucket "$SAM_ARTIFACTS_BUCKET" \
            --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          TEST_FILE="$(mktemp)"
          trap 'rm -f "$TEST_FILE"' EXIT
          printf 'sam-access-test\n' > "$TEST_FILE"

          TEST_KEY="${SAM_ARTIFACTS_PREFIX}/access-test-${GITHUB_RUN_ID}.txt"

          aws s3api put-object \
            --bucket "$SAM_ARTIFACTS_BUCKET" \
            --key "$TEST_KEY" \
            --body "$TEST_FILE" \
            >/dev/null

          aws s3api delete-object \
            --bucket "$SAM_ARTIFACTS_BUCKET" \
            --key "$TEST_KEY" \
            >/dev/null

          echo "Bucket SAM criado/validado com escrita e exclusao."

      - name: Deploy Lambda
        if: inputs.action == 'deploy'
        env:
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DATABASE_PORT: ${{ vars.DATABASE_PORT || '5432' }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME || 'oficina360' }}
          LAMBDA_SECURITY_GROUP_ID: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
          LAMBDA_SUBNET_IDS: ${{ vars.LAMBDA_SUBNET_IDS }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail

          : "${DATABASE_HOST:?Repository Variable DATABASE_HOST nao definida}"
          : "${DATABASE_PORT:?Repository Variable DATABASE_PORT nao definida}"
          : "${DATABASE_NAME:?Repository Variable DATABASE_NAME nao definida}"
          : "${LAMBDA_SECURITY_GROUP_ID:?Repository Variable LAMBDA_SECURITY_GROUP_ID nao definida}"
          : "${LAMBDA_SUBNET_IDS:?Repository Variable LAMBDA_SUBNET_IDS nao definida}"
          : "${DB_USERNAME:?GitHub Secret DB_USERNAME nao definido}"
          : "${DB_PASSWORD:?GitHub Secret DB_PASSWORD nao definido}"
          : "${JWT_SECRET:?GitHub Secret JWT_SECRET nao definido}"
          : "${SAM_ARTIFACTS_BUCKET:?Bucket SAM nao preparado}"
          : "${SAM_ARTIFACTS_PREFIX:?Prefixo SAM nao preparado}"

          if [[ ! "$DATABASE_HOST" =~ \.rds\.amazonaws\.com$ ]]; then
            echo "::error::DATABASE_HOST nao parece ser um endpoint RDS valido."
            exit 1
          fi

          if [[ ! "$DATABASE_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::DATABASE_PORT deve ser numerica."
            exit 1
          fi

          if [[ ! "$LAMBDA_SECURITY_GROUP_ID" =~ ^sg-[0-9a-f]+$ ]]; then
            echo "::error::LAMBDA_SECURITY_GROUP_ID possui formato invalido."
            exit 1
          fi

          if [[ ! "$LAMBDA_SUBNET_IDS" =~ ^subnet-[0-9a-f]+(,subnet-[0-9a-f]+)*$ ]]; then
            echo "::error::LAMBDA_SUBNET_IDS deve usar subnet-aaa,subnet-bbb."
            exit 1
          fi

          echo "Database host: $DATABASE_HOST"
          echo "Database port: $DATABASE_PORT"
          echo "Database name: $DATABASE_NAME"
          echo "Security Group: $LAMBDA_SECURITY_GROUP_ID"
          echo "Subnets: $LAMBDA_SUBNET_IDS"
          echo "Bucket de artefatos: $SAM_ARTIFACTS_BUCKET"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$SAM_ARTIFACTS_BUCKET" \
            --s3-prefix "$SAM_ARTIFACTS_PREFIX" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DatabaseHost="$DATABASE_HOST" \
              DatabasePort="$DATABASE_PORT" \
              DatabaseName="$DATABASE_NAME" \
              DatabaseUsername="$DB_USERNAME" \
              DatabasePassword="$DB_PASSWORD" \
              JwtSecret="$JWT_SECRET" \
              JwtIssuer="oficina360-auth" \
              JwtExpiration="3600" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              LambdaSubnetIds="$LAMBDA_SUBNET_IDS"

      - name: Obter URL da API
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail

          AUTH_API_URL="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='AuthApiUrl'].OutputValue | [0]" \
              --output text
          )"

          if [[ -z "$AUTH_API_URL" || "$AUTH_API_URL" == "None" ]]; then
            echo "::error::Output AuthApiUrl nao encontrado."
            exit 1
          fi

          echo "AUTH_API_URL=$AUTH_API_URL" >> "$GITHUB_ENV"
          echo "API Gateway URL: $AUTH_API_URL"

      - name: Mostrar outputs
        if: inputs.action == 'deploy'
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Gerar resumo do deploy
        if: inputs.action == 'deploy'
        run: |
          {
            echo "STACK_NAME=$STACK_NAME"
            echo "AUTH_API_URL=$AUTH_API_URL"
            echo "AWS_REGION=$AWS_REGION"
            echo "SAM_ARTIFACTS_BUCKET=$SAM_ARTIFACTS_BUCKET"
            echo "SAM_ARTIFACTS_PREFIX=$SAM_ARTIFACTS_PREFIX"
          } | tee lambda-deploy-summary.txt

      - name: Publicar resumo do deploy
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deploy-summary
          path: lambda-deploy-summary.txt
          if-no-files-found: error
          retention-days: 1

      - name: Destroy Lambda stack
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          else
            echo "Stack $STACK_NAME nao existe."
          fi

      - name: Limpar bucket SAM
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket \
            --bucket "$SAM_ARTIFACTS_BUCKET" \
            >/dev/null 2>&1; then

            echo "Bucket SAM nao existe ou nao esta acessivel."
            exit 0
          fi

          aws s3 rm \
            "s3://${SAM_ARTIFACTS_BUCKET}/${SAM_ARTIFACTS_PREFIX}/" \
            --recursive || true

          REMAINING_OBJECTS="$(
            aws s3api list-objects-v2 \
              --bucket "$SAM_ARTIFACTS_BUCKET" \
              --query 'KeyCount' \
              --output text
          )"

          if [[ "$REMAINING_OBJECTS" == "0" ]]; then
            aws s3api delete-bucket \
              --bucket "$SAM_ARTIFACTS_BUCKET" \
              --region "$AWS_REGION"

            echo "Bucket SAM vazio removido."
          else
            echo "Bucket SAM possui outros objetos e foi preservado."
          fi

      - name: Gerar diagnostico
        if: failure() && (inputs.action == 'deploy' || inputs.action == 'destroy')
        run: |
          {
            echo '===== AWS IDENTITY ====='
            aws sts get-caller-identity || true

            echo
            echo '===== STACK ====='
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" || true

            echo
            echo '===== STACK EVENTS ====='
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 30 || true

            echo
            echo '===== BUCKET SAM ====='
            echo "bucket=${SAM_ARTIFACTS_BUCKET:-nao-calculado}"
            echo "prefix=${SAM_ARTIFACTS_PREFIX:-nao-calculado}"

            if [[ -n "${SAM_ARTIFACTS_BUCKET:-}" ]]; then
              aws s3api get-bucket-location \
                --bucket "$SAM_ARTIFACTS_BUCKET" || true

              aws s3api list-objects-v2 \
                --bucket "$SAM_ARTIFACTS_BUCKET" \
                --prefix "${SAM_ARTIFACTS_PREFIX:-}" \
                --max-items 20 || true
            fi
          } > lambda-diagnostics.txt 2>&1

      - name: Publicar diagnostico
        if: failure() && (inputs.action == 'deploy' || inputs.action == 'destroy')
        uses: actions/upload-artifact@v4
        with:
          name: lambda-diagnostics
          path: lambda-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
